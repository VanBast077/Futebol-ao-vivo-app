<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futebol ao Vivo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>⚽ Futebol ao Vivo</h1>
    <p>Placar e resultados em tempo real</p>
</header>

<div class="container">

    <div class="card">
        <h2>🔴 Jogos ao Vivo</h2>

        <div class="jogo">
            <div>
                <div class="time">Flamengo</div>
                <div class="time">Palmeiras</div>
            </div>

            <div>
                <div class="placar">2 - 1</div>
                <div class="status">AO VIVO</div>
            </div>
        </div>

        <div class="jogo">
            <div>
                <div class="time">Barcelona</div>
                <div class="time">Real Madrid</div>
            </div>

            <div>
                <div class="placar">1 - 1</div>
                <div class="status">AO VIVO</div>
            </div>
        </div>

    </div>

    <div class="card">
        <h2>📅 Próximos jogos</h2>

        <div class="jogo">
            <div>
                <div class="time">Manchester City</div>
                <div class="time">Liverpool</div>
            </div>

            <div>
                <div class="placar">18:00</div>
            </div>
        </div>

        <div class="jogo">
            <div>
                <div class="time">São Paulo</div>
                <div class="time">Corinthians</div>
            </div>

            <div>
                <div class="placar">20:30</div>
            </div>
        </div>

    </div>

    <div class="card">
        <h2>⭐ Destaques</h2>
        <p>Acompanhe os principais jogos e resultados.</p>
        <button>Ver todos os jogos</button>
    </div>

</div>

</body>
</html>
